<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mask elements</title>
<!--
  Mask elements: an element painted its container's color to hide a line
  under it (TEST_SITES F-2, R-4). Shapes:
    - floating labels on an outlined input's top border (urbanplates
      checkout, Material "outlined" fields): position:absolute, padding
      0 4px, background = the form's white, sitting across the border line.
      As <label>, <span> and <div> (the strip only clears layout tags such
      as div, so the label and span kept their authored white: the white
      box over the label; the div lost it: the border line through the text)
    - Reddit-style comment thread connectors in a site that is in its own
      dark mode (the phone is in dark mode, so Reddit is): a vertical
      thread line (border-left), a curved elbow per reply (border-left +
      border-bottom + radius) and, below the last elbow, a 16 x 16 span
      painted the page's #0e1113 that hides the rest of the line. Inside a
      shadow root, as on shreddit. On a light Aura theme the span stays
      #0e1113: the black squares
-->
<style>
  body { margin: 0; font: 16px -apple-system, sans-serif; background: #fff; color: #1f1f1f; }
  form { padding: 8px 16px 24px; }
  .fld { position: relative; margin: 22px 0; }
  .in { box-sizing: border-box; width: 100%; height: 48px; padding: 0 12px; border: 1px solid #8a8a8a; border-radius: 6px; background: #fff; color: #1f1f1f; font: 16px sans-serif; }
  .fl { position: absolute; top: -9px; left: 10px; padding: 0 4px; background: #fff; color: #555; font-size: 12px; line-height: 18px; }
  .dark { padding: 12px 16px 40px; background: #0e1113; color: #d7dadc; }
  .dark h3 { margin: 0 0 8px; font-size: 15px; }
</style>
</head>
<body>
<form>
  <div class="fld"><input class="in" id="em" value="ada@example.com"><label class="fl" for="em">Email address</label></div>
  <div class="fld"><input class="in" value="Ada"><span class="fl">First name</span></div>
  <div class="fld"><input class="in" value="Lovelace"><div class="fl">Last name</div></div>
</form>
<div class="dark">
  <h3>Comments</h3>
  <x-thread></x-thread>
</div>
<script>
  customElements.define('x-thread', class extends HTMLElement {
    constructor() {
      super();
      var r = this.attachShadow({ mode: 'open' });
      var rows = '';
      for (var i = 0; i < 3; i++) {
        rows += '<div class="reply"><span class="elbow"></span><div class="body">Reply ' + (i + 1) + ': nested comment text that wraps onto a second line on a phone.</div></div>';
      }
      r.innerHTML = '<style>' +
        '.tree { position: relative; padding-left: 28px; }' +
        '.line { position: absolute; left: 11px; top: 0; bottom: 0; border-left: 1px solid #3e4142; }' +
        '.reply { position: relative; padding: 8px 0; }' +
        '.elbow { position: absolute; left: -17px; top: 0; width: 16px; height: 22px; border-left: 1px solid #3e4142; border-bottom: 1px solid #3e4142; border-bottom-left-radius: 12px; }' +
        '.mask { position: absolute; left: 4px; bottom: 0; width: 16px; height: 16px; background: #0e1113; }' +
        '.more { padding: 6px 0 0; color: #82959b; font-size: 13px; }' +
        '</style>' +
        '<div class="top">Parent comment by u/example: the start of the thread.</div>' +
        '<div class="tree"><div class="line"></div>' + rows +
        '<div class="more">2 more replies</div><span class="mask"></span></div>';
    }
  });
</script>
</body>
</html>
