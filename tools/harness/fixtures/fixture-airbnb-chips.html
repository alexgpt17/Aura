<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airbnb chips fixture</title>
<!--
  Offline stand-in for small floating surfaces (TEST_SITES A-4; Nov 5 phone
  findings). Shape, not content:
    - airbnb.com category chips: a[role=tab] > a transparent 28x28
      position:absolute span > an emoji <video>. isLikelyFloatingIconControl
      matches the span (small, absolute, inside a clickable tab), and the
      old pass painted it --aura-overlay: a square box around each emoji.
    - a Bearbottom-style chat launcher: a transparent 64x64 position:fixed
      wrapper (cursor:pointer) around a round, authored-opaque button.
      Painting the wrapper draws a square around the circle.
  Controls that must keep working:
    - a close button over a photo with a dark translucent scrim
      (rgba(0,0,0,.5), Google Shopping's shape): keep the scrim.
    - a share button over a photo with an opaque white disc: a theme
      surface (--aura-overlay).
-->
<style>
  body { margin: 0; font: 15px -apple-system, system-ui, sans-serif; background: #fff; color: #222; }
  .hdr { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid #ebebeb; }
  .tabs { display: flex; gap: 18px; overflow: hidden; padding: 10px 16px 0; }
  .tabs a { position: relative; display: flex; flex-direction: column; align-items: center; min-width: 64px; padding-top: 34px; padding-bottom: 10px; font-size: 12px; color: #717171; text-decoration: none; cursor: pointer; }
  .tabs a[aria-selected="true"] { color: #222; border-bottom: 2px solid #222; }
  .tabs .ico { position: absolute; top: 2px; left: 50%; margin-left: -14px; width: 28px; height: 28px; }
  .tabs .ico video { display: block; width: 28px; height: 28px; background: #f3c26b; border-radius: 50%; }
  main { padding: 16px; }
  .photo { position: relative; height: 280px; border-radius: 14px; background: linear-gradient(135deg, #6a8caf, #c5d6e8); margin-bottom: 22px; }
  .photo .close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; background: rgba(0,0,0,.5); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .photo .share { position: absolute; top: 12px; left: 12px; width: 32px; height: 32px; border-radius: 50%; background: #fff; color: #222; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .row { height: 120px; margin-bottom: 16px; border-radius: 10px; background: #f7f7f7; }
  .chat { position: fixed; right: 16px; bottom: 16px; width: 64px; height: 64px; z-index: 50; cursor: pointer; }
  .chat .bubble { width: 64px; height: 64px; border-radius: 50%; background: #1f6feb; box-shadow: 0 4px 12px rgba(0,0,0,.25); }
</style>
</head>
<body>
<div class="hdr">
  <div class="tabs" role="tablist">
    <a role="tab" aria-selected="true" href="#icons"><span class="ico"><video muted playsinline></video></span>Icons</a>
    <a role="tab" href="#views"><span class="ico"><video muted playsinline></video></span>Views</a>
    <a role="tab" href="#beach"><span class="ico"><video muted playsinline></video></span>Beach</a>
    <a role="tab" href="#cabins"><span class="ico"><video muted playsinline></video></span>Cabins</a>
  </div>
</div>
<main id="list">
  <div class="photo"><span class="share" role="button" aria-label="Share">↗</span><span class="close" role="button" aria-label="Close">×</span></div>
</main>
<div class="chat" aria-label="Open chat"><div class="bubble"></div></div>
<script>
  var m = document.getElementById('list');
  for (var i = 0; i < 14; i++) m.insertAdjacentHTML('beforeend', '<div class="row"></div>');
</script>
</body>
</html>
