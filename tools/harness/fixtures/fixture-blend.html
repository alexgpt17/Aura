<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blended images</title>
<!--
  Product photos blended onto light tiles (TEST_SITES B-3, Amazon "Similar
  products"). Product shots have white backgrounds; the site sets
  mix-blend-mode: multiply (or darken) so the white drops out into the
  tile's light gray. The engine has always forced `img { mix-blend-mode:
  normal }`, so the blend that survives is on a wrapper around the photo.
  Shapes:
    - a 2-column grid of tiles (div, #f7f8f8, a little larger than the
      photo): multiply on a wrapper div, on a <picture>, darken on a
      wrapper div, and one multiply <img> (the case already neutralized)
    - a large white result card (photo + title + price) whose photo
      wrapper is multiplied onto the card itself
  Themed dark, the strip clears the tile, so the photo multiplies with the
  dark page: nearly black.
-->
<style>
  body { margin: 0; font: 15px -apple-system, sans-serif; background: #fff; color: #0f1111; }
  h3 { margin: 12px 16px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 16px; }
  .tile { padding: 8px; border-radius: 8px; background: #f7f8f8; }
  .tile img { display: block; width: 100%; height: auto; }
  .mx { mix-blend-mode: multiply; }
  .dk { mix-blend-mode: darken; }
  picture { display: block; }
  .cap { margin: 6px 0 12px; font-size: 13px; }
  .card { margin: 16px; padding: 12px; border-radius: 8px; background: #fff; box-shadow: 0 0 0 1px #ddd; }
  .card .ph { width: 120px; height: 120px; mix-blend-mode: multiply; float: left; margin-right: 12px; }
  .card .ph img { width: 120px; height: 120px; }
  .card .price { font-size: 20px; font-weight: 700; }
</style>
</head>
<body>
